<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>multiagent-chat</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/htmx.min.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>multiagent-chat</h1>
      <span class="sub">Repository-backed multi-agent software engineering</span>
    </header>

    <form class="card" hx-post="/ui/projects" hx-target="#project-registration">
      <h2 class="section">Register a GitHub project</h2>
      <label for="project_name">Project name</label>
      <input type="text" id="project_name" name="name" placeholder="Payments service">
      <label for="repository">GitHub repository</label>
      <input type="text" id="repository" name="repository" placeholder="owner/repository">
      <label for="default_branch">Default branch</label>
      <input type="text" id="default_branch" name="default_branch" value="main">
      <button type="submit" class="ghost">Register repository</button>
      <div id="project-registration"></div>
    </form>

    <form class="card" hx-post="/ui/tasks" hx-swap="none">
      <h2 class="section">Create task</h2>
      <label for="kind">Task type</label>
      <select id="kind" name="kind" onchange="syncTaskFields()">
        <option value="new_project">New Project</option>
        <option value="feature">Feature</option>
        <option value="bug_fix">Bug Fix</option>
      </select>

      <div id="existing-fields" hidden>
        <label for="project_id">Registered project</label>
        <select id="project_id" name="project_id" disabled
                hx-get="/ui/projects" hx-trigger="load" hx-swap="innerHTML">
          <option value="">loading projects…</option>
        </select>
      </div>

      <div id="new-fields">
        <label for="technology">Technology</label>
        <select id="technology" name="technology">
          <option value="rust">Rust</option>
          <option value="java_spring_boot">Java / Spring Boot</option>
          <option value="python">Python</option>
          <option value="type_script_node">TypeScript / Node.js</option>
          <option value="custom">Other</option>
        </select>
        <input type="hidden" id="output" name="output" value="reviewable_result">
        <div class="hint">This phase produces a reviewable result from an isolated server workspace.</div>
      </div>

      <label for="title">Title</label>
      <input type="text" id="title" name="title" required placeholder="Add idempotency to payment creation">
      <label for="description">Description</label>
      <textarea id="description" name="description" required
                placeholder="Describe the required behavior, constraints, and acceptance expectations."></textarea>

      <button type="submit">Start collaboration</button>
      <div id="create-error"></div>
    </form>
  </div>
  <script>
    function syncTaskFields() {
      const isNew = document.getElementById('kind').value === 'new_project';
      const existing = document.getElementById('existing-fields');
      const fresh = document.getElementById('new-fields');
      existing.hidden = isNew;
      fresh.hidden = !isNew;
      document.getElementById('project_id').disabled = isNew;
      document.getElementById('technology').disabled = !isNew;
      document.getElementById('output').disabled = !isNew;
    }
    syncTaskFields();
  </script>
</body>
</html>
